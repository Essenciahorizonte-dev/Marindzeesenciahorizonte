
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Conheça a equipa da Marindze Consultoria & Serviços, E.I. Profissionalismo, dedicação e compromisso com os nossos clientes.">

  <title>A Nossa Equipa | Marindze Consultoria & Serviços</title>

  <!-- Folha de estilos principal -->
  <link rel="stylesheet" href="../css/style.css?v=2">
</head>

<body>

  <main>

    <!-- SECÇÃO DA EQUIPA -->
    <section class="section team-section" id="equipa">

      <div class="container">

        <!-- INTRODUÇÃO -->
        <div class="team-intro">

          <span class="section-tag">
            A nossa equipa
          </span>

          <h2>
            Pessoas dedicadas ao seu negócio
          </h2>

          <p>
            Na Marindze Consultoria & Serviços, contamos com
            uma equipa comprometida com a qualidade, o
            profissionalismo e a satisfação dos nossos clientes.
            Trabalhamos com dedicação para oferecer soluções
            e um acompanhamento de confiança.
          </p>

        </div>

        <!-- GALERIA DA EQUIPA -->
        <div class="team-gallery">

          <!-- FOTOGRAFIA PRINCIPAL -->
          <figure class="team-photo team-photo-main">

            <img
              src="../assets/equipa1.jpeg"
              alt="Equipa da Marindze Consultoria e Serviços"
              loading="lazy"
              decoding="async"
            >

            <figcaption>
              <h3>A nossa equipa</h3>

              <p>
                União, profissionalismo e compromisso
                com os nossos clientes.
              </p>
            </figcaption>

          </figure>

          <!-- FOTOGRAFIA SECUNDÁRIA -->
          <figure class="team-photo team-photo-secondary">

            <img
              src="../assets/equipa2.jpeg"
              alt="Responsável da Marindze no escritório"
              loading="lazy"
              decoding="async"
            >

            <figcaption>
              <h3>Compromisso e dedicação</h3>

              <p>
                Acompanhamento atento e dedicação
                em cada actividade.
              </p>
            </figcaption>

          </figure>

        </div>

      </div>

    </section>
    <!-- FIM DA SECÇÃO DA EQUIPA -->

  </main>

</body>
</html>
